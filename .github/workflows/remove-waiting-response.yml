name: Remove waiting-response label

on: [issue_comment]

jobs:
  remove_label:
    if: github.actor != 'cyrilgdn'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const label = "waiting-response";
            const labels = context.payload.issue.labels || [];
            if (!labels.some((l) => l.name === label)) {
              core.info(`Issue #${context.issue.number} has no "${label}" label, nothing to do.`);
              return;
            }
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              // The label may have been removed between the event and this call.
              if (error.status === 404) {
                core.info(`"${label}" label already removed from #${context.issue.number}.`);
                return;
              }
              throw error;
            }
