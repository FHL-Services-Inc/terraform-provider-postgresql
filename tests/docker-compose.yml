services:
    postgres:
        build: 
          context: build
          args:
            - PGVERSION=${PGVERSION}
        user: postgres
        command:
          - "postgres"
          - "-c"
          - "wal_level=logical"
          - "-c"
          - "max_replication_slots=10"
          - "-c"
          - "shared_preload_libraries=/opt/dummy_seclabel/dummy_seclabel"
        environment:
            POSTGRES_PASSWORD: ${PGPASSWORD}
        ports:
            - 25432:5432
        healthcheck:
          # TCP, not the socket: the image's init-time server only listens on
          # the socket, so this turns healthy once the real server is up.
          test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1" ]
          interval: 2s
          timeout: 5s
          retries: 30
